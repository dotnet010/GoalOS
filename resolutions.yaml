  R-1162:
    desc: "MultiLLM 决策链路(会议 #198, D27 采纳): ①CLI goalos review accept <goal> / goalos review refine <goal> --feedback '...' 映射 daemon 已有 reviews decide 端点; reviews decide 的 retry 决策删除——retry 统一走 goalos retry(R-1127 唯一恢复原语, 避免双 retry 语义); ②DIVERGENCE 数据源: MultiLLMVerificationCompleted payload 增 divergence: bool + votes[](各模型 verdict); 分歧判定=votes 集合大小>1; failHints 行选择规则=投票判定函数(全票 FAIL→FAIL 行; 有 FAIL 有 PASS→DIVERGENCE; 仅 WARN 无 FAIL→WARN 行), 定义于 05 MultiLLM 节; 05 FailureContext 增 divergence 字段。修订注记(就地修订): S-20 投票合成函数单一权威(穷尽闭合): 全 FAIL→FAIL 行; 含 FAIL 非全 FAIL→DIVERGENCE 行; 无 FAIL 含 WARN→WARN 行; 全 PASS→PASS; divergence 标志=DIVERGENCE 行(与行选择同源); tainted_review=divergence=true 轮次; 05:1347 元验证仲裁挂起 v0.4.0(05 段落标注'v0.3.0 不实现', 诚实标注); DIVERGENCE→NeedsReview 用户裁决(既有链); S'-07 05 §3.3 全节重写——删除 severity_weighted_majority 打分/risk_override 档(R3 super_majority/R4 unanimous/R5 unanimous_plus_behavioral 降级)/ABSTAIN/Provider 降权 ×0.5 机制; S-20 四规则=唯一合成函数(R-844 一票一 Provider 未加权胜出); ABSTAIN 从投票值枚举删除(Provider 超时=FAIL, reason=llm_timeout, 与 07:213-215 既有机制一致); n=1 时结果=唯一实票; QualityGate 映射定稿: verdict∈{PASS,WARN}→pass(warnings 留痕)、FAIL/DIVERGENCE→NeedsReview 路径; daemon.yaml arbitration 配置键删除; D42/D27② 引用目标更新为 S-20 函数; 07 verdict 取值补 DIVERGENCE; 05 FailureContext.divergence 字段语义=选中 DIVERGENCE 行; F-21 ABSTAIN 残留清扫: 07 的 vote_distribution.abstain/abstentions/consensus 三字段删除+05:2136 MUST_NOT 行改写+multillm.go:114 迁移点入 S'-07 落地清单+must_not_exist 锚点; F-23 S'-07 补 multillm.go VerdictCombiner 重写(weightedScore/ABSTAIN/Divergent)。未修订部分保留原文本。disposition: 生效"
