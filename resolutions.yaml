    desc: "六命令后端定义(会议 #198, D28 采纳): ①goalos insert=追加需求软入口(不直接改 DAG——MissionGraph 唯一作者=规划器, R-1130): POST /v1/goals/{id}/requirements, 事件 RequirementAdded(core)→MissionEngine 重规划→新图→风险级变化则重新审批(Governance 裁决), 无变化则原审批延续; ②adjust --budget: POST /v1/goals/{id}/budget, 事件 BudgetAdjustmentRequested(core, Publisher=Channel Adapter)→BudgetTracker 校验(硬上限不可超)→TokenBudgetAdjusted(Publisher=BudgetTracker, D8 已定); ③config set: POST /v1/config(写端点, 需认证, body={key,value}), daemon 校验 schema→写入→ConfigReloaded(现有事件); ④cache rebuild: POST /v1/cache/rebuild(管理端点); ⑤login --token: CLI 认证 token 与 Capability Token 分离——CLI 凭证存 ~/.goalos/auth.json(0600), Capability tokens 存 daemon 数据目录 tokens.json(Capability Engine 唯一所有者不变); localhost 免认证=loopback 绑定无认证, login 仅在远程绑定(0.0.0.0)时必需; ⑥security rotate-key: goalos security rotate-key + POST /v1/security/rotate-key(管理端点), 语义=轮换 daemon_secret(D13 会话密钥派生源), 轮换后所有插件会话失效需重新握手; ⑦metrics: 05 指标清单为唯一权威, 04 metrics 命令输出=05 清单快照; check_results_total 枚举统一四值 pass/warn/block/reject(05 胜出, 与 Check 契约一致); 04 的 publish_latency_p95/decisions_total/token_usage_percent/active_goals 注册进 05 清单(decisions_total 与 decide_paths_total 合并为 decisions_total)。修订注记(就地修订): S-28① 审批延续=per-action 语义: 原已批动作 token 延续, 新动作一律按自身风险级走 Approval 引擎(治理不可绕过不变量); S-02⑥ rotate-key 语义简化: 轮换仅影响后续 token 签发(存量 token 立即失效+AuditLogWritten), 现有插件会话不受影响(会话密钥与 daemon_secret 已解耦); S-29 端点分层认证: 治理级端点(decision/confirm/retry/requirements/budget/config/security/cache)→默认通道=unix socket(0700 目录, 文件权限即认证)+远程绑定必选 token; 只读端点(status/events/metrics/error explain)→loopback 免认证、远程需 token; S-36 config 写路径安全发布: handler 校验 schema→构造不可变快照→atomic.Pointer 交换(复用既有热加载路径)→ConfigReloaded 事件; 写入目标=内存快照+配置文件(daemon 唯一写者, CLI 不直写); S'-03 transport×认证矩阵定稿: 治理级端点=unix socket(0700 目录)且任何监听面上必选 token, 默认不暴露于 loopback TCP(治理级端点只走 unix socket+token 双闸); 远程绑定=全部端点必选 token; CLI 本机治理命令走 unix socket; S'-18③ rotate-key 二路语义定稿: 例行轮换=双密钥过渡(旧签名 TTL 内有效, 新 token 用新密钥), 泄露响应=立即全部撤销(R-507 不变), 两路径触发条件与审计事件分开写; token 校验作用点=会话建立时(授权快照), 会话存续期