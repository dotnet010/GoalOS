    desc: "核心循环三命令三件套补全(会议 #198, D26 采纳): ①approve/reject: 单端点 POST /v1/goals/{id}/actions/{action_id}/decision(body={decision: approve|reject, feedback?, client_request_id}), CLI goalos approve/reject 映射之; 事件 UserDecisionReceived{decision, approver, feedback}(core, Publisher=Channel Adapter HTTP handler)→Governance 裁决→ActionApproved/ActionRejected; 幂等: decision_id=(goal_id,action_id) 幂等键, 重复提交同 decision→返回缓存裁决结果; ②confirm: POST /v1/goals/{id}/confirm, 事件 UserConfirmed(已有), 迁移 Planned→Running(矩阵行已有), CLI goalos confirm --goal <id>; ③retry: POST /v1/goals/{id}/retry(body={feedback?, from_failed_action?}), 新事件 RetryRequested{goal_id, feedback, requester}(core, Publisher=Channel Adapter)→GoalRunner 裁决→重规划或重跑, 前置状态=NeedsReview 或 Failed, --feedback 载荷→MissionEngine 重规划输入; ④failHints TIMEOUT'继续等待: 超时延长': CLI 发 decision=wait_more→daemon 将 TimeoutAt 延长一个 approval_timeout_seconds(UpdatableTimer 模式), 上限 approval_max_extensions(默认 3, 注册 Config)次后强制裁决——无限延长=审批可无限挂起, 违反'审批必须终结'治理不变量。修订注记(就地修订): S-16① decision 枚举补 wait_more: {approve, reject, wait_more}; 幂等键改 client_request_id((goal_id,action_id) 退为'裁决结果缓存键', wait_more 不经该键去重); wait_more 经事件投递 GoalRunner(取消+重挂定时器, 世代号防陈旧触发), HTTP handler 不直写 TimeoutAt; S-17 延长计数入 PipelineSnapshot(extensions_used 字段, 随快照持久化, 防重启归零), 达上限(approval_max_extensions=3)强制裁决=ActionRejected(approval_timeout); S-18 wait_more 仅 ActionPendingApproval 态有效, 终态后到达→StateMachineViolation 拒绝+failHints'重新提交'出口文案; S-19 决策幂等缓存落 bbolt decision 桶(按幂等键持久去重, 跨重启有效)——幂等承诺覆盖 daemon 生命周期; S-44/S'-29 落地文档清单补 01 §17.9+锚点('decision=wait_more'); S'-05② confirm 端点前置状态扩为 Planned|NeedsReview, 01 §17.9 补第四行 failHint'确认临时 Flow'; S'-06③ retry 前置状态扩为 NeedsReview|Failed|Paused(Paused 限 plan_failed 场景, 语义=重新规划); S'-10 第 4 次 wait_more 拒绝错误码 approval_extensions_exhausted 注册 09; F-33 approval_extensions_exhausted 边界=extensions_used≥approval_max_extensions 时收到 wait_more→返回该错误码, failHint 文案入 01 §17.9。未修订部分保留原文本。disposition: 生效"
