    desc: "目标偏离检测(会议 #193——P4, Carmack): 攻击行为第一表征=偏离目标声明, 而 MissionGraph 与工具调用流从未对齐测量——无法测量的攻击不可防御。两层检测: ①确定性层零误报硬契约(工具调用集 vs 目标声明集偏离+循环检测+预算异常+金丝雀信号复用) ②语义层统计遥测(ESN+CUSUM 模式检测, ~200μs/步, 无需第二 LLM, 实证 71% @5%FP; 确定性层贡献 +60% 且零误报)。信号→不自动阻断: 暂停+审批升级+通知+人类裁决; 闭环=drift 确认→statefs rollback(R-1035)→重跑(实证修复率 52→73%)。确定性层误报=契约测试 FAIL。落地: 05 §3.18+计划任务 1.29/5.13+TestDriftDetector_DeterministicLayer_ZeroFalsePositive/TestDriftDetector_EscalatesNotBlocks。disposition: 生效"
