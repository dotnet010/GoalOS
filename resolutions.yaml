  R-1095:
    desc: "状态代数矩阵与 Stopped 终态(会议 #195——C P0-3/P0-4, Carmack): 事实核查属实——05:1215 Paused|GoalStopRequested|Failed+05:4017 GoalStopRequested→Failed(user_stopped) 而 API 返回 {status:stopped}——用户主动停止被伪装为失败, 审计数据被污染, 恢复逻辑无法区分'不该重试的失败'与'可恢复的异常'。状态代数矩阵 GoalState×ActionState×PipelineState×ApprovalState 单一权威定义(每维独立终态集合+合法迁移表); Stop/Cancel/Fail 语义分离: Stopped(user_stopped)=用户主动停止终态(不伪装 Failed), Cancelled=治理层撤销, Failed=异常终止; 迁移表穷尽+契约测试断言每条非法迁移被拒绝。落地: 05 §5 状态机节+TestStateMatrix_StoppedTerminal_NotFailed/TestStateMatrix_IllegalTransitionRejected。disposition: 生效"
