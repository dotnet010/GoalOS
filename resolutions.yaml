    desc: "Logical/Physical Truth 与 Commit Point(会议 #195——C P0-2/D-1, Linus): statefs 与 events.jsonl 恢复顺序未定义=恢复死锁点; 两个真相源无主从——崩溃后不知道信谁。events.jsonl=Logical Truth(唯一权威); statefs=Physical Truth(加速投影, 可丢弃、可从事件重放重建); Commit Point = Event Commit ∩ StateFS Commit(两者落盘才对外可见); Action Commit = Logical+Physical+Audit 三合一; 恢复顺序唯一: 先 Event 恢复(权威), 再 statefs reconcile(投影对齐); statefs 损坏/落后→丢弃重建(快照从不是权威); Audit 是 append-only 证据链不在 reconcile 范围。落地: 05 §4 一致性模型节+TestRecovery_EventAuthority_StateFSReconcile/TestCommitPoint_EventAndStateFSAtomic。disposition: 生效"
    files: [会议纪要.md, 05软件架构文档.md]
    verify:
      - must_exist: "Logical Truth"
        in_file: 05软件架构文档.md
        reason: "05 §4 必须落 Logical Truth 唯一权威定义"

  R-1093:
    desc: "定期增量 Checkpoint(会议 #195——G-3, Pike): 只靠优雅关闭写 snapshot→崩溃后重放 50 万事件 O(N), 冷启动 O(1) 承诺破灭。业界标准(Axon @Snapshotting(afterEvents=100)/Pekko snapshotEvery(100)/actor-ts everyNEvents(N))=every-N-events 快照+bounded replay: 每 Action 边界+每 1000 事件强制快照, 重放上界 O(1000); 快照原子写入(临时文件+rename); 损坏快照=校验失败丢弃回退上一快照(快照从不是权威, 业界一致)。落地: 05 §4+TestCheckpoint_Every1000Events_BoundedReplay/TestCheckpoint_CorruptSnapshot_FallbackReplay。disposition: 生效"
    files: [会议纪要.md, 05软件架构文档.md]
