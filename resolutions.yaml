  R-1167:
    desc: "审批超时归一+单计时器槽(会议 #198, D32 采纳): ①审批等待超时→ActionRejected(approval_timeout)(04/06/07 R-1124 胜出——超时即拒绝, failHints 给'继续等待/重新提交'出口); 删除 05:4088 HumanInterventionRequested 超时路径与 05:877/885 Decide(ESCALATE, wait_timeout) 残留——ESCALATE 仅由 Check 失败/异常路径触发, HumanInterventionRequested 仅用于 escalation_reason(D10); ②计时器按状态区分: ActionPendingApproval 期=approval_timeout_seconds, ActionExecuting 期=action.Timeout——状态互斥故同一时刻仅一个活动计时器; GoalRunner 单一计时器槽=TimeoutAt+TimeoutKind{approval|execution|wait}(UpdatableTimer 模式, 状态迁移时才设置, 重入同状态不清零——修复'每次进入 StateWait 重起计时器'缺陷); ③计时器到期由独立到期机制直接发布事件(不依赖下次 Run() 检查): 审批到期→ActionRejected(approval_timeout); 依赖/资源等待到期→新事件 WaitTimeoutOccurred{conditions[]}(core, Publisher=GoalRunner)→StateWait→StateDecide→Decide(ESCALATE, reason=wait_timeout); ④WaitResult 生产者=Wait 条件评估器(GoalRunner 在 StateWait 评估 conditions[](D11④ 结构), 产出 WaitResult{satisfied, unmet_conditions[]}); ⑤依赖条件来源修正:=DAG 前置节点完成事件+ResourceAvailable 事件(D8), 非 Decide 输出——Decide 仅输出 CONTINUE/ESCALATE 不变; ⑥'任一超时→部分满足条件回滚'定义: 回滚=已满足条件标记失效+重评估(不重跑已完成节点, ResumePoint 不动), 超时条件记入 WaitTimeoutOccurred。修订注记(就地修订): S-11 TimeoutKind 枚举补 review: {approval, execution, wait, review, governance}; 恢复快照补 TimeoutKind 字段(四元组→五元组); 07 注册 ReviewTimedOut{goal_id, reason}(core, Publisher=GoalRunner)作 NeedsReview→Paused 迁移事件; S-12 到期执行者裁决: 到期=GoalRunner 内部持久计时器(TimeoutAt+TimeoutKind 持久化 bbolt, 恢复时重挂)——'独立到期机制'修正为'独立于 Run() 调用循环'; 审批到期路径=GoalRunner 收到到期信号→调 Governance 确定性裁决(超时→拒绝)→Governance 发布 ActionRejected(approval_timeout)(ActionApproved/ActionRejected 唯一发布者=Governance 不变, 超时只是触发源); 人裁决与超时同帧竞速=按事件 global_seq 先后仲裁, 败者 state_changed 拒收; S-13 ApprovalState TimedOut 终态删除(超时=Rejected(approval_timeout) 单一结局); S-15 竞速仲裁统一规则: 到期事件与条件满足事件并发→按 global_seq 先后, 先发布者胜; 该规则为所有'到期 vs 人裁决 vs 条件满足'竞速的单一权威; S-22 ESCALATE 触发集单一权威表={check_failure, wait_timeout, warning_threshold, canary_triggered, physical_guard}; D32① 收窄为'审批超时不走 ESCALATE(=ActionRejected)'; S-14② 重签发等待期审批计时器停用(TimeoutAt 清除), 治理评估独立时限=TimeoutKind=governance+policy.token_reeval_timeout(默认 600s)→超时→ActionRejected(governance_denied); S'-13 TimeoutKind=execution 派发链定稿: GoalRunner 到期信号→IPC 终止帧(复用 D15 升级链, 标注 timeout 起因)→PluginRunner 发布 ActionFailed(error_type=timeout); ReviewTimedOut.reason 枚举={timeout}; Decide reason=check_failure 注册锚点补入; S 族落地锚点'05 §3.14'改内容锚点'05 审批计时器节'(现行 §3.14 实为 ModelRouter, 节号漂移纪律); S'-15 仲裁点钉死: 到期信号无 global_seq——仲裁点=Governance 决策队列串行化+结果事件 WAL 序; 到期信号经 GoalRunner→Governance 调用入同一队列; 用词统一'先到者胜'(队列序); 败者用户响应契约=decision 端点返回 state_changed+CLI 文案'已超时, 请重新提交'; 重启后 TimeoutAt 已过→立即触发(确定性); S'-09⑥ S-12 两前提写入强制性文字: 计时器信号必须在 GoalRunner goroutine 内消费(不得另起 goroutine 直调 Governance); Governance 不得自行开 bbolt tx 写 decision 桶; F-08 败者决策不入 WAL core 流(检查失败于 WAL append 之前, 串行化点前拒绝); 审计痕迹=AuditLogWritten{event:'user_decision_rejected', reason:'state_changed'} side_effect 事件(审计五引擎完整性保留)。未修订部分保留原文本。disposition: 生效"
