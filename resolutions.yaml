  R-1080:
    desc: "金丝雀三层机制(会议 #193——P2, Kees): 攻破沙箱若有真实高价值数据攻击者动机无限——'无利可图'是第一性威慑, 让第一次越界即触发警报。①workspace 外金丝雀=逃逸检测(文件路径+内容双层哨兵, 正常流程永不触碰→零误报硬契约) ②workspace 内金丝雀=超宽 profile 检测 ③假凭据本地解析陷阱(假 API key 指向本地解析地址, 解析动作即触发 ~0.01s, 避开 TruffleHog 静态绕过——真凭据法 2-3min 延迟且可被静态扫描发现)。触发=审计事件+审批升级+用户通知, 只升级不自动阻断; 金丝雀不参与任何正常流程; 季度轮换+触发即失效重建。落地: 06 §9.7+计划任务 1.27/3.21+TestCanary_TouchTriggersAudit/TestCanary_NoFalseTrigger_NormalFlow。disposition: 生效"
