    desc: "网络隔离机制改写(会议 #199, S-01 采纳): ①socket() 调用族参数过滤(family 是数值参数, 纯 BPF 可实现)——网络能力插件 socket 调用全拒; ②出网唯一通道=daemon 侧代理白名单(插件经 IPC 请求代理转发, 代理执行 AllowOutbound/AllowedHosts/AllowedPorts 规则); ③平台矩阵: Linux 5.9+/macOS 追加 seccomp-notify/sandbox-exec 细检查(后续版本), 信创 4.19=纯 BPF 粗过滤+代理(诚实标注); ④哨兵路径监控改写: macOS=sandbox-exec 路径 deny 规则; Linux 有 Landlock(5.13+) 平台可选; 其余平台=内容扫描检测(哨兵路径串/内容 hash 命中 FD3 消息与产物); ⑤D21 废弃名单恢复'代理'一条(唯一免 root 可行通道), iptables/nftables 维持废弃。修订注记(后续修订): S'-01 代理组件完整规格扩展(R-1244); F-02 AF_UNIX 五重约束(R-1284); F-03 SIGSTOP 前提(R-1285); F-09 08 白名单表修订+FD3 继承姿态(R-1291); F-29 代理暂停起点(R-1311); F-31 代理 Host 头钉死(R-1313)。disposition: 生效"
    files: [08沙箱隔离与进程通信规范.md, 06安全模型文档.md]
