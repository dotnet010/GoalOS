  R-1087:
    desc: "信创降级链重排+seccomp-only 硬化(会议 #194——P-B, Kees): seccomp BPF 无法安全按路径过滤(只能按 fd/参数)——路径在 BPF 检查后可经 /proc/self/fd 重解析(TOCTOU), 这正是 Landlock 被设计为 inode 级内核强制的原因(4.19 无 Landlock)——'未验完'不是进度问题是机制性缺陷。降级链重排: 信创 L4 主路径=gVisor systrap(无 KVM 依赖, SECCOMP_RET_TRAP, 4.19 可跑——R-1078 延伸); seccomp-only 仅作 gVisor 不可用时的 L2 兜底+硬化三件(①参数级路径前缀过滤+拒绝 /proc/self/fd 重解析 ②fd 卫生联动 R-1086 封 fd 通道 ③Compile 期强制最小挂载集 R-1090)。对抗向量分级: 可验证向量(路径穿越/符号链接劫持/写白名单滥用——BPF 可断言) vs 已知弱向量(TOCTOU 重解析竞态——不可完全验证, 诚实标注 L2 残余风险清单入 06)。90 天真机窗口(R-1067)内完成真机对抗验证或升级 L4。落地: 08 §18.3 硬化+§19.8 信创 L4 主路径+计划任务 5.15。disposition: 生效"
