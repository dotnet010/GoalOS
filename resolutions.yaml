  R-1086:
    desc: "统一 spawn 原语+通用 fd 卫生契约(会议 #194——P-A/P-F, Linus): 已打开 fd 是'已授权句柄'——子进程继承后无需 open() 即可读写, 绕过文件白名单与 seccomp 路径过滤双层; LWN 结论: CLOEXEC 是主防线但第三方库'哪怕一瞬间'非 CLOEXEC fd 即漏洞——子进程内关全部 fd 是必需纵深, 不能只靠 CLOEXEC。四防线: ①创建期——全部 fd 创建经统一 wrapper 强制 O_CLOEXEC, CI AST 检查直调 syscall/cgo 裸 fd 创建 ②启动期——daemon 启动即关全部非预期继承 fd: close_range(5.9+)优先, 信创 4.19 /proc/self/fd 遍历兜底; CPython bpo-47260 教训——seccomp 拒绝 close_range 返回 EPERM/EACCES 但不关任何 fd, 任何错误必须无条件 fallback, 禁止假设已关闭 ③spawn 期——全模块唯一 spawn 入口(散落 os/exec 直调=CI import 检查 FAIL, R-953 模式)+fork-exec 间独立 /proc/self/fd 扫描关闭(不依赖 runtime 行为); Windows PROC_THREAD_ATTRIBUTE_HANDLE_LIST 显式继承白名单(仅 stdio+FD3) ④验证期——对抗契约: 子进程枚举 /proc/self/fd 断言仅 {0,1,2,FD3}。落地: 08 §18.4 扩展+计划任务 1.32/3.24+TestProcess_Spawn_OnlyStdioAndFd3。disposition: 生效"
    files: [会议纪要.md, 08沙箱隔离与进程通信规范.md]
    verify:
      - must_exist: "统一 spawn 原语"
        in_file: 08沙箱隔离与进程通信规范.md
        reason: "08 §18.4 必须落统一 spawn 原语四防线"

  R-1087:
    desc: "信创降级链重排+seccomp-only 硬化(会议 #194——P-B, Kees): seccomp BPF 无法安全按路径过滤(只能按 fd/参数)——路径在 BPF 检查后可经 /proc/self/fd 重解析(TOCTOU), 这正是 Landlock 被设计为 inode 级内核强制的原因(4.19 无 Landlock)——'未验完'不是进度问题是机制性缺陷。降级链重排: 信创 L4 主路径=gVisor systrap(无 KVM 依赖, SECCOMP_RET_TRAP, 4.19 可跑——R-1078 延伸); seccomp-only 仅作 gVisor 不可用时的 L2 兜底+硬化三件(①参数级路径前缀过滤+拒绝 /proc/self/fd 重解析 ②fd 卫生联动 R-1086 封 fd 通道 ③Compile 期强制最小挂载集 R-1090)。对抗向量分级: 可验证向量(路径穿越/符号链接劫持/写白名单滥用——BPF 可断言) vs 已知弱向量(TOCTOU 重解析竞态——不可完全验证, 诚实标注 L2 残余风险清单入 06)。90 天真机窗口(R-1067)内完成真机对抗验证或升级 L4。落地: 08 §18.3 硬化+§19.8 信创 L4 主路径+计划任务 5.15。disposition: 生效"
    files: [会议纪要.md, 08沙箱隔离与进程通信规范.md]
    verify:
      - must_exist: "seccomp-only 硬化"
        in_file: 08沙箱隔离与进程通信规范.md
        reason: "08 §18.3 必须落 seccomp-only 硬化三件"

  R-1088:
    desc: "内核 CVE 威胁模型+风险分层强制(会议 #194——P-C, Lipner): L3 及以下与宿主共享内核——攻击面=内核 attack surface 全集, 任何内核提权 bug 定义上即容器逃逸; Copy Fail CVE-2026-31431(2017 以来几乎所有发行版 page-cache LPE, 跨租户传播)+runc CVE-2024-21626(Leaky Vessels)/Dirty Pipe/cgroup release_agent 同谱系; Bugcrowd 明确 gVisor 'not affected; no shared host kernel' 并推荐 AI 代码执行沙箱迁移 microVM/gVisor。①威胁模型登记: L3 及以下内核 CVE 残余风险入 06 §5+FSR bug bar(发布时逐级声明) ②风险分层强制: 高危目标(R-986 风险层级)强制 L4/L5 后端, L3 仅限低风险+诚实标注 ③运营闭环: 内核 CVE 订阅任务——CVE feed→影响分析(受影响后端/版本)→安全公告+必要时禁后端/升级 gVisor。落地: 06 §5 残余风险段+计划任务 7.17。disposition: 生效"
    files: [会议纪要.md, 06安全模型文档.md]
