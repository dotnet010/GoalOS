    desc: "L4-L5 隔离层级扩展(会议 #193——P1, Linus): seccomp+namespace 之上仍共享同一内核, 攻击面=内核 attack surface 全集——隔离强度上限由'与宿主共享多少代码'决定。L4=gVisor 后端(Sentry 用户态内核+Gofer 9P; Linux/信创: KVM 探测优先、无 KVM 自动 systrap——systrap 用 SECCOMP_RET_TRAP 无需硬件虚拟化, 信创 4.19 内核同样可跑 L4; 不兼容 syscall 一律 seccomp 兜底 fail-closed, 不用'放宽'补齐)+Windows Sandbox .wsb(Pro/Enterprise, air-gap 模式, 不可用诚实标注降级); L5=一次性执行环境; macOS 诚实标注维持 Seatbelt(无等价物, App Sandbox 增强维持 v1.5+ 排期); 能力探测+自动降级链 L5→L4→L3→L2, 每级降级=审计事件+诚实标注。落地: 06 §5 层级表+08 §19.8+计划任务 1.26/3.19/3.20。disposition: 生效"
