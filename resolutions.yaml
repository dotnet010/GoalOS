    desc: "Guard LLM 前置审查(会议 #193——P3, Carmack): 单一模型自证=不可验证; OWASP LLM01 提示注入第一攻击面, 模式检测对新颖语义攻击仅 9.09%(中文 CTF 实测)——架构护栏>内容护栏。三层验证: ①静态确定性层(CommandSpec/TOML profile/参数白名单, 零延迟) ②Guard LLM(第二模型跨 Provider 部署 OpenAI↔Ollama 交叉; 不可信输入以数据非指令呈现+显式分隔符; 结构化 verdict=ALLOW/DENY/ESCALATE) ③人类终审。DENY=fail-closed; ALLOW 仍需行为测试复核(不自证); guard 不可用→自动升级至最高审批级(fail-closed 不是拒绝服务, 是升级)。多 agent 复核实证 52.49→71.90% 零误报+121ms。落地: 05 §3.17+计划任务 1.28/5.12+TestGuardLLM_InjectionResistant/TestGuardLLM_FailClosed。disposition: 生效"
    files: [会议纪要.md, 05软件架构文档.md]
