    desc: "Flow 校验结局分型(会议 #198, D36 采纳): ①校验失败按失败类型三分路: a) 结构非法→MissionGraphRejected→重规划(≤2 次)→第 3 次→Goal→NeedsReview(reason=plan_failed)(用户裁决: retry/改需求/终止——直接终态 Failed 剥夺 R-1127 恢复原语; 修订 D8: GoalRunner 计数 3 次后发布的终态事件由 GoalFailed 改为 NeedsReview 迁移, 发布权单一=GoalRunner 不变); b) Flow 无匹配模板→用户确认临时 Flow(R-515)/连续 3 次→自动降级 generic-v1+用户通知——发生在规划阶段(Flow 选择), 不产生 Rejected; c) 契约冲突→R-1130 仲裁(契约优先+动态规划补足, 不拒绝); ②PlanningCircuitBreaker 触发规则单一化:=同一 Goal 连续 3 次 MissionGraphRejected(与重规划计数同源同一计数器); GLOSSARY'连续 2 次'改 3 次、删除'或规划 Token>30%'条件(Token 预算熔断归 BudgetTracker 机制, 单列不混入)。修订注记(就地修订): S-24③ GoalFailed reason 枚举删除 plan_failed; S-26 熔断定稿: 熔断动作=MissionEngine 拒绝新规划请求(返回错误码 planning_circuit_open, 注册 09); 计数器=per-Goal 持久化(bbolt Goal 状态投影 planning_fail_count); 重置=用户 RetryRequested 或新增需求(新意图); S-27 临时 Flow 确认复用既有链(不新增交互面): 无匹配模板→GoalNeedsReview(reason=flow_template_missing)→用户 confirm(D26 端点+UserConfirmed)即确认临时 Flow 继续; '自动降级 generic-v1'改为用户可选项(NeedsReview failHint 提示'可降级 generic-v1'), 不静默降级(R-515 原则); 降级计数 per-Goal 持久化; S'-04 熔断机制改判(S-26 原文删除, 以本条替代): 删除 PlanningCircuitBreaker 独立机制与 planning_circuit_open 错误码; 熔断态=NeedsReview(reason=plan_failed) 本身(用户三选项即出口); GLOSSARY'2次/Token>30%'词条已删, 熔断词条改注记'熔断=NeedsReview(plan_failed) 迁移'; 规划 Token 预算熔断归 BudgetTracker(既有职责); D36② 修订为'S-26 原文删除, 以本条目替代'; S'-05 confirm 链路补全: 矩阵补行 NeedsReview→(UserConfirmed, 守卫 reason=flow_template_missing)→Running(确认=接受临时 Flow 并继续执行); 降级计数语义定稿=同 Goal 历史无匹配次数, 仅用于 failHint 展示(无自动动作), Goal 终态清零, 投影持久化(S'-10); F-10 planning_fail_count 投影窗口=自最近一次 MissionGenerated 起连续计数; 消费者点名=04 review 输出+01 §17.9 呈现(消除'无读方'); F-23 S'-04 补代码迁移点 flowengine.go:253-280 PlanningCircuitBreaker 删除。未修订部分保留原文本。disposition: 生效"
