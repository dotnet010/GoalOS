  R-1091:
    desc: "CompletionContract 第一性原则(会议 #195——C-17/G-5/D-2, Carmack): CompletionContract 是'mission 完成'的判定却被定义为执行产物之一——判定者与被判定者同源(LLM 生成的测试测 LLM 生成的代码=自己批改作业)。第一性原则裁决: mission 完成 ⇔ CompletionContract 验证通过且作为系统状态记录(与事件/文件同等持久化), 不是执行副产物; auto_tests 在 MissionGraph 预览阶段由 FlowComposer 固化(治理审批通过后冻结), 测试意图经人类审查(审批流一部分, 不可跳过); 执行在沙箱内(E2B 模式, 工业实践 ~150-200ms 启动), 结果结构化回报。落地: 05 §3.19+TestCompletionContract_RecordedAsSystemState/TestAutoTests_FrozenAtPreview_HumanReviewed。disposition: 生效"
