name: W1-2 macOS 平台专项特测车道（darwin-nightly）

# R-1695-2（PM 裁定 2026-09-10——「FD3 Broker 6 测试归类：分层纳管，拒绝一刀切」）：
# 物理 Socket 与路径边界测试（涉及 sun_path、目录权限的实测）归入平台专项特测车道。
# 本工作流=该车道的 darwin 触发面（linux=windows-daily/docker-publish，见各文件）。
#
# 触发档位=**手动触发（workflow_dispatch）**，定时闸刻意未启用：
#   macOS runner 计费约为 linux 的 10×（成本承载决策归 PM——启用即改下行为
#   schedule: - cron: "0 3 * * *"（与 windows-daily 02:00 UTC 错峰），一行之差）。
#   未启用定时=车道可达但零经常性成本；「登记为自动 nightly 而实际不跑」=冒充，禁。
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 3 * * *"   # 启用=PM 成本裁定后放开（macOS runner 计费 10×）

jobs:
  darwin-platform:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # 平台专项特测：真实 unix socket bind + sun_path=104B 预算决算 + 目录权限 +
      # 镜像连带清理 + 并发连接隔离。刻意不带 -race：TSan ⊥ 受限 Seatbelt profile=
      # 平台事实（red-evidence 2026-09-10 对档——darwin race 非本项目闸口，race 闸=linux CI）。
      - name: Platform-lane tests (build tag platformtest)
        run: go test -count=1 -v -timeout 180s -tags platformtest ./internal/...
