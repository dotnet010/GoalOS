name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  windows-gate:
    # R-1672（Jobs 2026-09-06 指令）：「windows-daily 必须全部亮绿」=不可逾越
    # 发版卡点——tag 指向的 SHA 必须有 windows-daily success run（缺/红/超时=中止）。
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
    steps:
      - name: Checkout（脚本来源）
        uses: actions/checkout@v7
      - name: windows-daily 全绿硬闸
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/check-windows-daily-green.sh "${{ github.sha }}"

  test:
    needs: windows-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build plugins (required for releasecheck)
        # 可复现配方（R-1695）：CGO_ENABLED=0 + -trimpath + -buildvcs=false——剥离
        # C 工具链/构建路径/VCS 元数据三类非代码因素（env 步骤级=shell 无关）。
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -buildvcs=false -o ./plugins/capability/shell-executor/plugin-shell ./cmd/plugin-shell
          go build -trimpath -buildvcs=false -o ./plugins/capability/websearch/plugin-websearch ./cmd/plugin-websearch

      - name: Update plugin signatures (Go 工具——跨平台，与 Windows 每日构建/make ci 同源)
        run: |
          # CI-built binaries have different SHA256 than local builds.
          # Update plugin.json signatures so releasecheck passes.
          # 统一走 scripts/update_plugin_signatures.go（该工具的创建动机即消灭
          # 本步骤曾经的 bash+jq 双实现）；无插件更新时工具 exit 1 形成硬闸口。
          go run scripts/update_plugin_signatures.go

      - name: Vet
        run: go vet ./...

      - name: Run tests (sequential, no race)
        run: CGO_ENABLED=0 go test -p 1 -count=1 -timeout 300s ./internal/...

      - name: Run tests (race, full)  # v0.2.0 audit: 全量 race 覆盖
        run: go test -p 1 -count=1 -timeout 300s -race ./...

      # R-1695 ②（FD3 测试分层纳管）：平台专项特测车道（linux runner=unix socket
      # 物理面：真实 bind/sun_path 预算形态/0600 权限/并发连接隔离）。
      - name: Platform-lane tests (build tag platformtest)
        run: go test -p 1 -count=1 -v -timeout 300s -tags platformtest ./internal/...

      - name: L6 Release Readiness (v0.1.1)
        run: go test -v -run TestReleaseReadiness ./internal/releasecheck/

      - name: CI Check Scripts (v0.2.0 audit)
        run: |
          bash scripts/check-anti-cheat.sh .
          bash scripts/check-naked-map.sh .
          bash scripts/check-error-swallow.sh .
          bash scripts/check-contract-test-assertion.sh .
          bash scripts/check-plugin-protocol.sh .
          bash scripts/check-dead-code.sh .
          # 会议 #190 R-1052: 决议传播完整性检查（第 7 硬闸口）。
          # 开发文档/ 不在本仓库（GIT-RULES 规则5）→ 脚本自动降级为 repo-only:
          # 编号连续性(R-543)+YAML 格式硬闸口，层1/层2/幽灵显式 SKIP（输出可见）。
          # 完整两层验证由本地 make ci 强制执行（工作区布局全量模式）。
          bash scripts/check-resolution-propagation.sh
          # 会议 #195 R-1099: 文档一致性双闸口（第 8/9 硬闸口）。
          # 同样 repo-only 自动降级跳过；全量检查由本地 make ci 强制执行。
          bash scripts/check-doc-version.sh
          bash scripts/check-deprecated.sh
          # 会议 #200 R-1267/R-1268: 完整性/错误码/风险表三闸口（第 10/11/12 硬闸口）。
          # 同样 repo-only 自动降级显式 SKIP；全量检查由本地 make ci 强制执行。
          # 补齐后 CI 与 make ci 的 12 脚本清单一致（此前缺 3 个，文档声称全跑）。
          bash scripts/check-doc-completeness.sh
          bash scripts/check-error-codes.sh
          bash scripts/check-risk-table.sh
          # 会议 #272：测试夹具敏感路径写入机检（第 13 硬闸口——事故实证：
          # 测试毁损真实 ~/.ssh/config；三段判定=敏感目录构造+终段字面量+写入动词）。
          bash scripts/check-sensitive-path-write.sh
          # 任务 8.5（会议 #237 Linus——发版前版本号不得落后）：tag↔CanonicalVersion 硬闸。
          # tag 上下文本工作流天然具备（on.push.tags=v*）→ 不等即红；不入 make ci
          # （本地无 tag 上下文恒 SKIP，入列=无牙占位）。事故史=常量滞留 0.1.3 三版本。
          bash scripts/check-version-sync.sh

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # v0.3.0 发布修正: release 任务曾硬编码 1.23 导致跨平台构建直接失败
          # （go.mod requires go>=1.25.0）。与 test 任务同源：以 go.mod 为唯一版本权威。
          go-version-file: go.mod

      - name: Build multi-platform binaries
        run: |
          mkdir -p dist
          for target in "darwin/amd64" "darwin/arm64" "linux/amd64" "linux/arm64" "windows/amd64"; do
            os=$(echo $target | cut -d/ -f1)
            arch=$(echo $target | cut -d/ -f2)
            ext=""
            [ "$os" = "windows" ] && ext=".exe"

            echo "Building goalos-daemon for $os/$arch..."
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w" -o dist/goalos-daemon${ext} ./cmd/goalos/

            echo "Building goalos for $os/$arch..."
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w" -o dist/goalos${ext} ./cmd/goalos-cli/

            # Package
            if [ "$os" = "windows" ]; then
              (cd dist && zip "goalos-${os}-${arch}.zip" goalos-daemon.exe goalos.exe)
            else
              (cd dist && tar czf "goalos-${os}-${arch}.tar.gz" goalos-daemon goalos)
            fi
            echo "Packaged goalos-${os}-${arch}"
          done

          # 信创 / 麒麟 Kylin V10 SP1（PM 指令 2026-09-10——发布文件纳入信创系统）。
          # 承载机制=**运行时**（R-1679/R-1681）：daemon 启动期 Prepare 探测 `bwrap`
          # 二进制（麒麟 V10 SP1 系统自带 0.4.0=零额外依赖）+实证 spawn，成功即注册
          # 受限档 T1 Provider——**与构建标签无关**（通用 linux/amd64 同源同能力）。
          # 构建面=linux/amd64 + `-tags xinchuang`：该标签作用面**仅限** internal/sandbox
          # 编译面（档位后端 gVisor/Linux ↔ Xinchuang 骨架 + 平台后端声明测试；骨架当前
          # **零生产引用**——R-1695① 档位注记族 I3/I4/I5=`[议程注记 / 待落地]`），
          # **不改变生产执行路径**。故异名=分发标注（目标平台声明），非能力差异。
          # 与通用 linux/amd64 产物**分列不同产物名**（不互相冒充：同名同物才可互换）。
          # 名实修正（R-1645）：957c87c/68b8943 提交信息与规格 v2.9 原记「沙箱后端切
          # xinchuang-sandbox（内核基线 4.19——Landlock 不可用）」= 失实表述（该标签
          # 选中的是零引用骨架，生产承载面两构建相同），本注记为其前向修正。
          echo "Building goalos-daemon for linux/amd64 (xinchuang / Kylin V10 SP1)..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags xinchuang -trimpath -buildvcs=false -ldflags="-s -w" -o dist/goalos-daemon-xinchuang ./cmd/goalos/
          echo "Building goalos for linux/amd64 (xinchuang / Kylin V10 SP1)..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags xinchuang -trimpath -buildvcs=false -ldflags="-s -w" -o dist/goalos-xinchuang ./cmd/goalos-cli/
          (cd dist && tar czf goalos-kylin-v10-sp1-amd64.tar.gz goalos-daemon-xinchuang goalos-xinchuang)
          echo "Packaged goalos-kylin-v10-sp1-amd64"
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "GoalOS ${{ github.ref_name }}"
          # Release 正文纪律（2026-09-10，PM 指令①）：
          #   ① 只链**已入库**目标——`开发日志.md` 属内部文档（.gitignore 未入库），
          #      渲染面必 404；原「See 开发日志 for full details」句（指向该未入库
          #      文件）整句删除，改由本节下载表 + 自动生成 changelog 承载信息。
          #   ② 信创分发说明**收敛**：不再单列 `### 信创` 特殊节（该节隐含「与通用
          #      linux/amd64 有差异」的失实暗示——R-1645），并入统一下载表 + 一行
          #      等价性注记（承载=运行期 bwrap 探测，与构建标签无关）。
          body: |
            ## Changes in ${{ github.ref_name }}

            ### 下载

            | 平台 | 产物 |
            | --- | --- |
            | macOS | `goalos-darwin-arm64.tar.gz`、`goalos-darwin-amd64.tar.gz` |
            | Linux | `goalos-linux-amd64.tar.gz`、`goalos-linux-arm64.tar.gz` |
            | Windows | `goalos-windows-amd64.zip` |
            | 麒麟 Kylin V10 SP1（信创） | `goalos-kylin-v10-sp1-amd64.tar.gz` |

            > 信创包 = linux/amd64 加 `-tags xinchuang` 编译，**与通用 linux/amd64 同源同能力**：
            > 受限档由 daemon 启动期探测系统自带 `bwrap`（麒麟 V10 SP1 自带 0.4.0，零额外依赖）
            > 运行期注册，与构建标签无关。异名仅为目标平台分发标注，非能力差异。

            ### Docker
            ```
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```
          files: dist/goalos-*.tar.gz,dist/goalos-*.zip
          generate_release_notes: true

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
