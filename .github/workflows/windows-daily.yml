name: W1-2 Windows 每日构建与测试（任务 1.4——CI windows-latest runner 接入）

on:
  schedule:
    - cron: "0 2 * * *"   # 每日 02:00 UTC
  push:
    branches: [dev/v0.3.0, main]
  workflow_dispatch:

jobs:
  windows-build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Build plugins (required for releasecheck)
        run: |
          go build -o ./plugins/capability/shell-executor/plugin-shell ./cmd/plugin-shell
          go build -o ./plugins/capability/websearch/plugin-websearch ./cmd/plugin-websearch

      - name: Update plugin signatures (parity with docker-publish)
        shell: pwsh
        run: |
          Get-ChildItem -Path plugins/capability -Directory | ForEach-Object {
            $manifest = Join-Path $_.FullName "plugin.json"
            if (Test-Path $manifest) {
              $json = Get-Content $manifest -Raw | ConvertFrom-Json
              $binPath = Join-Path $_.FullName ($json.binary + ".exe")
              if (Test-Path $binPath) {
                $sig = "sha256:" + (Get-FileHash $binPath -Algorithm SHA256).Hash.ToLower()
                $json.signature = $sig
                $json | ConvertTo-Json -Depth 8 | Set-Content $manifest -Encoding UTF8
                Write-Output "Updated $manifest -> $sig"
              }
            }
          }

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Test（Windows 适用子集——build-tag 分平台）
        run: go test -count=1 -timeout 120s ./internal/... ./pkg/...
