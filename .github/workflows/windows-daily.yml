name: W1-2 Windows 每日构建与测试（任务 1.4——CI windows-latest runner 接入）

on:
  schedule:
    - cron: "0 2 * * *"   # 每日 02:00 UTC
  push:
    branches: [main, "feat/**", "fix/**"]  # 分支策略（R-1634——会议 #253）：main+feat/fix 短命分支
  workflow_dispatch:

jobs:
  windows-build-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Build plugins (required for releasecheck)
        # 可复现配方（R-1695）：CGO_ENABLED=0 + -trimpath + -buildvcs=false——剥离
        # C 工具链/构建路径/VCS 元数据三类非代码因素（env 步骤级=shell 无关，
        # pwsh/bash 双兼容——本 job 默认 pwsh，内联 `VAR=x cmd` 形态不可用）。
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -buildvcs=false -o ./plugins/capability/shell-executor/plugin-shell.exe ./cmd/plugin-shell
          go build -trimpath -buildvcs=false -o ./plugins/capability/websearch/plugin-websearch.exe ./cmd/plugin-websearch

      - name: List plugin dirs (diagnostic)
        shell: pwsh
        run: Get-ChildItem -Recurse plugins/capability | Select-Object FullName, Length

      - name: Update plugin signatures (Go 工具——跨平台，与 Linux 行为一致)
        run: go run scripts/update_plugin_signatures.go

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: |
          # 钉版本：v0.8.0 起要求 Go >= 1.26，与 go.mod 的 1.25.0 不兼容（GOTOOLCHAIN=local 不会自动升级）
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...

      # U1000/SA4006 按构建上下文判定——单 GOOS 静态检查=其他平台符号面盲检
      #（2026-09-06 实证事故：windows-daily 连红 4 次未察+linux/darwin 各压潜在项）。
      - name: Staticcheck（跨 GOOS——linux/darwin 符号面）
        shell: bash
        run: |
          GOOS=linux staticcheck ./...
          GOOS=darwin staticcheck ./...

      - name: Test（Windows 适用子集——build-tag 分平台）
        run: go test -count=1 -timeout 120s ./internal/... ./pkg/...

      # R-1695 ②（FD3 测试分层纳管）：平台专项特测车道=物理传输面（真实命名管道
      # bind/管道名形态/并发连接隔离）——与轻量常规车道分列（常规车道已零 OS 依赖）。
      # 缺此步=Windows 物理传输面 CI 零实证（登记为绿灯则是冒充）。
      - name: Test（平台专项特测车道——build tag platformtest）
        run: go test -count=1 -v -timeout 120s -tags platformtest ./internal/...

      # R-1654：AppContainer smoke 显式作业——管理员态（runneradmin）机制可用性实证。
      # 非管理员面=实机/用户环境（red-evidence 族）——两面不互相冒充。
      # verbose 出数=每次运行留完整探针证据链（ERRNO 数字族）。
      - name: WinAC smoke（R-1654——AppContainer 机制 CI 实证：契约五面+TC-RT-001a 生产基座旁路）
        run: go test -count=1 -v -timeout 180s -run "TestWinACProvider|TestRuntime_Bypass_SyscallDenied_Windows" ./internal/runtime/
