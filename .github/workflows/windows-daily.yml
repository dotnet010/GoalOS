name: W1-2 Windows 每日构建与测试（任务 1.4——CI windows-latest runner 接入）

on:
  schedule:
    - cron: "0 2 * * *"   # 每日 02:00 UTC
  push:
    branches: [main]  # 分支策略（2026-08-17 Jobs 裁定）：只保留主分支
  workflow_dispatch:

jobs:
  windows-build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Build plugins (required for releasecheck)
        run: |
          go build -o ./plugins/capability/shell-executor/plugin-shell.exe ./cmd/plugin-shell
          go build -o ./plugins/capability/websearch/plugin-websearch.exe ./cmd/plugin-websearch

      - name: List plugin dirs (diagnostic)
        shell: pwsh
        run: Get-ChildItem -Recurse plugins/capability | Select-Object FullName, Length

      - name: Update plugin signatures (Go 工具——跨平台，与 Linux 行为一致)
        run: go run scripts/update_plugin_signatures.go

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Test（Windows 适用子集——build-tag 分平台）
        run: go test -count=1 -timeout 120s ./internal/... ./pkg/...
