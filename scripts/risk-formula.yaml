# =============================================================================
# GoalOS 风险公式机器可读单一数据源（D44 R-1179 / S'-25 R-1268）
#
# check-risk-table.sh 只读本文件重算比对 05软件架构文档.md capability_risk_map。
# 维度变更只改本文件——禁在脚本或文档内嵌第二份维度表。
#
# 转录源: 05软件架构文档.md 风险公式段（2026-08-13 会议 #200 S'-25 裁决目标态）:
#   权重全 1 求和; 阈值 0:R0, 1-3:R1, 4-5:R2, 6-7:R3, 8-9:R4, 10+:R5。
#   维度枚举: d∈{0,1,2,3}, e∈{0,1,2}, p∈{0,1,3}, r∈{0,2}（枚举外分值=数据错误）。
# 修订注记（就地修订, R-1063 先例）: 映射表维度值按 R-1179 公式重算+枚举修正——
#   fs.write r:1→2, browser.click r:1→0, payment.initiate p:2→1（枚举外分值）。
# =============================================================================
version: 1
formula:
  score: "sum"            # 权重全 1 求和（D44 裁决结果）
  weights:
    destructiveness: 1
    external: 1
    privilege: 1
    reversibility: 1
  dimension_values:       # 公式枚举（R-1179: 枚举外分值=数据错误）
    destructiveness: [0, 1, 2, 3]
    external: [0, 1, 2]
    privilege: [0, 1, 3]
    reversibility: [0, 2]
  thresholds:             # sum → R 级（上界 999 作 open 上限）
    - {level: R0, min: 0, max: 0}
    - {level: R1, min: 1, max: 3}
    - {level: R2, min: 4, max: 5}
    - {level: R3, min: 6, max: 7}
    - {level: R4, min: 8, max: 9}
    - {level: R5, min: 10, max: 999}
dimension-matrix:
  fs.read:              {destructiveness: 0, external: 0, privilege: 0, reversibility: 0}   # sum 0 → R0
  browser.open:         {destructiveness: 0, external: 1, privilege: 0, reversibility: 0}   # sum 1 → R1
  fs.write:             {destructiveness: 1, external: 0, privilege: 0, reversibility: 2}   # sum 3 → R1
  browser.click:        {destructiveness: 1, external: 1, privilege: 0, reversibility: 0}   # sum 2 → R1
  github.push:          {destructiveness: 1, external: 1, privilege: 0, reversibility: 2}   # sum 4 → R2
  shell.execute:        {destructiveness: 2, external: 2, privilege: 1, reversibility: 2}   # sum 7 → R3
  fs.delete:            {destructiveness: 2, external: 0, privilege: 0, reversibility: 2}   # sum 4 → R2
  database.delete:      {destructiveness: 3, external: 0, privilege: 1, reversibility: 2}   # sum 6 → R3
  payment.initiate:     {destructiveness: 3, external: 2, privilege: 1, reversibility: 2}   # sum 8 → R4
