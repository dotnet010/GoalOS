  - name: '组提交（R-1039 判定——原 R-1038 撤销）'
    description: 'Q 顾问"批量回填阻塞审批"的机制选型记录：**不采纳（附证据）**——GoalOS 事件写入=单条 Append+单次 fsync（statestore mu 串行，全库无 batch 路径），无长事务无饥饿，审批最多等 1 次 fsync（~ms）；组提交收益场景（高频并发提交）与 Action 级事件频率不匹配。**登记设计种子**：未来若出现真实批量写入路径，启用 Critical/Standard/Bulk 优先级类+syncWorker 解耦（NodeDB/NoKV 先例）。权威：05 §3.10.1 单一写入点并发模型'
