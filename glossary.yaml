  - name: 'bbolt（R-1109/R-1175）'
    description: 'statefs 实现选型（钉死）：纯 Go 单文件 MVCC KV——事务原子提交、MVCC 读视图=ReadTx（禁称快照，R-1116）、崩溃安全（B+tree copy-on-write）。**R-1175 物理载体单一化（会议 #198）**：bbolt=statefs 唯一载体，路径=~/.goalos/state.db；桶 schema=meta/events-index/checkpoints/goals/{goal_id}/projections+decision 桶（UserDecisionReceived/ActionApproved/ActionRejected 事件投影）+drift-detector 桶；Checkpoint=bbolt 一致性快照；tx 纪律=tx 内事件索引+投影原子写（投影=纯函数），副作用/下游事件发布一律 tx 提交后执行（不在源事件 tx 内），事件处理器禁止重入 bbolt 写，写锁等待>1s→事件排队退避；单一 store 写者+串行化段=internal/statestore 单 goroutine（append→fsync→global_seq 分配→bbolt tx→tx 提交后出队下游事件再入 append 循环），废弃 AtomicEventStore 拆除；单一全局 WAL 文件 events.jsonl（per-goal 目录布局废弃）+一次性迁移脚本=独立 cmd/ 工具（daemon 检测旧布局拒绝启动并提示迁移；tie-break=(occurred_at, goal_id, per-goal seq)）；写者循环重入不变量（F-05/R-1287）：写者循环内禁止同步调用任何会重新入 store 的路径，发布=fire-and-forget 投递入写者输入通道，handler 不得阻塞写者循环。选型钉死=实现有物理载体，非技术幻觉。权威：05 §3.19.5'
    has_schema: 1
    defined_in: '05软件架构文档.md'
  - name: 'ResumePrimitive（R-1112）'
