    description: '隔离等级（执行后端隔离度，R-1098 命名分离——R-1114 全量传播：隔离维度一律 I0-I5，禁 L 前缀）。**阶梯唯一定义（R-1506——会议 #234，修订 R-1354 的 I4 部分）**：I0=无隔离（仅进程边界）；I1=进程边界+资源限制；I2=OS 原生强制**单面**（syscall 过滤族或文件系统禁闭族任一，诚实标注覆盖面）；I3=I2 双面齐备（syscall 过滤+文件系统禁闭）；I4=独立内核边界（gVisor 用户态内核/Windows Sandbox/HV 微虚拟机——信创 systrap 可达）；I5=一次性执行环境。**金丝雀移出阶梯**（数据面检测归五支柱，不是隔离边界）；macOS Seatbelt=I2 唯一值（文件禁闭单面）。与 R0–R5 正交：风险→最小隔离映射归治理策略（06 §1.3 签发决策表）。权威：06 §1.3'
    has_schema: 0
    defined_in: '05软件架构文档.md'
  - name: '执行分级（ExecutionTier——T 族速记，R-1475/R-1477/R-1498/R-1521）'
    description: '运行时边界四档（权威：05 §X.6）：**T0 协作档**=I1 扩展（进程边界+资源限制+能力代理协议——协议外直接系统调用不被拦截，仅限名单登记工作负载（R-1619 会议 #249 信任语义重述：T0 信任=本机管理员显式登记 trusted_workloads 白名单的管理员信任决策——非发行者密码学认证；publisher_key=审计身份标签不参与运行时验证，签名验证=未来方向）；v0.3.1 仅测试夹具可达——R-1507 诚实标注）；**T1 受限档**=I2/I3（OS 原生强制，按平台探测落档）；**T2 强隔离本地档**=**I4 强度+本地拓扑**（R-1521 定义放宽——热池=延迟优化形态非档位定义；本地 I4 后端（gVisor 类——**未实现**，v0.4.0 评估立项）=T2 非热池形态，R-1599 修订「既有」声明删除；延迟按实测诚实标注）；**T3 强隔离远程档**=I4-remote（v0.3.1 不做——R-1483：远程需求由远程代理托管承接）。档位编号=呈现与决策顺序，**非强度严格单调**（T0 与 T1/T2/T3 不同轴=协作 vs 强制；T2=T3 同强度异拓扑）；与部署拓扑两轴正交（见"隔离强度与部署拓扑"词条）。**降级边界（R-1497）**：契约 MinIsolation=硬地板——既有自动降级链 I5→I4→I3→I2 只允许在 ≥MinIsolation 范围内运作，低于地板=拒绝+治理重新评估；**双路径关闭（R-1512③）**：v0.3.1 起所有执行走契约硬地板'
    has_schema: 0
    defined_in: '05软件架构文档.md'
  - name: '协作/受限/强隔离/远程（产品语义词，R-1477/R-1527）'
    description: '用户可见文本（CLI/提示/文档）唯一合法分级词汇，依次对应 T0/T1/T2/T3——v0.3.1 呈现=**协作/受限两档可用+强隔离档仅在探测到 I4 后端时呈现**（R-1599 修订 R-1542——会议 #248：「T2 生产路径真实可达」前提证伪，I4 后端未实现；探测不到=不呈现=无死呈现；R-1617 会议 #249 本词条同步）；远程档本版本不呈现，T3 不做）；工程文档可用 T 族速记；用户可见处禁止出现 T0/I4 等工程词汇（TC-RT-100 grep 断言——范围=人类可读通道）。**JSON 机器值枚举登记（R-1527——三方映射唯一权威=本词条）**：cooperative/constrained/hardened_local/hardened_remote。**"远程"两义分离（R-1527）**：档位词"远程"=T3；R-1483 的远程承接路径措辞="远程代理托管"（agent 远程管理）——两词不同义，用户可见文本用后者指承接路径'
