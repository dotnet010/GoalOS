  - name: 'Compile 期冻结（R-1090）'
    description: '运行时挂载集机制链第二步（08 §18.4）：工具链发现（ldconfig -p 采集+ld.so.cache 内容哈希，不一致→重建或诚实降级——distroless 教训）→**Compile 期冻结**（工具链路径集+cache 哈希冻结入 CompiledProfile，每次 Compile 冻结不跨次复用）→挂载子序列（§18.2：tmpfs 根→工具链 ro,nosuid bind→workspace→deny 遮蔽→procfs→/dev→pivot_root→seccomp）。运行时新增库=重新 Compile；禁止运行时动态补挂载'
    has_schema: 0
    defined_in: '05软件架构文档.md'
