  - name: 'DLL 搜索路径劫持防线（R-1089）'
    description: 'Windows 向量⑦（T1574.001）四件套（08 §19.9）：①SetDefaultDllDirectories（Microsoft 权威缓解 KB2533623；单次调用规避 SetDllDirectory 覆盖 caveat）②插件可执行文件目录只读（copy-to-readonly——应用目录搜索第一+不可写=劫持落点不存在）③编译期契约 writable dirs ∩ dll search dirs = ∅ ④加载路径审计（Sysmon Event 7 等价物）+SafeDllSearchMode 核验。契约测试 TestSandbox_Adversarial_Windows_DLLHijack 先红后绿'
