  - name: 'CompiledProfile（R-1008）'
    description: 'Sandbox.Execute 的 `profile` 参数类型（05 §X.1a）。**值类型 struct**。**零值非法化（R-1106 — 会议 #195 修正）**：Execute 入口零值检测→Fatal fail-closed——零值不再是"Level 0 显式形态"（旧语义已废弃），Level 0 也必须经 Compile() 显式构造（明确配置，绝无隐式默认降级）。"不可为空"（R-975）语义修订为：**必须由 `Compile(profile, caps)` 产出**——调用方禁止手造/零值绕过编译。**R-1036 opaque 强化**：规则字段全不导出（外部包复合字面量=Go 编译期拒绝，语言级机制非约定——盲区 4）；唯一非零构造途径=Compile()（导出 getter 读路径：Level()/Platform()/...）；零值声明 Go 允许（issue #333）——Execute 入口零值检测→Fatal（fail-closed：宁可拒绝执行，不可无配置执行）；同包手造=信任边界。跨平台策略：超集结构体+Platform 字段+Extensions map（08 §19）。`Result.SandboxLevel ≤ CompiledProfile.Level` 为契约测试断言（诚实标注验证）'
    has_schema: 1
    defined_in: '05软件架构文档.md'
  - name: 'CompletionContract 第一性原则（R-1091/R-1102）'
    description: 'mission 完成 ⇔ CompletionContract 验证通过**且作为系统状态记录**（与事件/文件同等持久化）——CompletionContract 不是执行副产物，是判定者（判定者与被判定者同源=LLM 生成的测试测 LLM 生成的代码=自己批改作业）。auto_tests 可执行协议：MissionGraph 预览阶段固化（审批通过后冻结）→**人类审查测试意图**（审批流一部分，不可跳过不可自动化豁免）→沙箱内执行（E2B 模式）→结构化回报→失败=mission 未完成。权威：05 §3.19.1'
    has_schema: 0
    defined_in: '05软件架构文档.md'
  - name: 'Logical Truth / Physical Truth（R-1092）'
    description: '双真相源主从定义：events.jsonl=**Logical Truth**（唯一权威，状态从事件重放推导）；statefs=**Physical Truth**（加速投影，可丢弃、可从事件重放重建，Checkpoint 从不是权威）。**Commit Point=逻辑 Commit=WAL append+fsync 完成（R-1175 S-06 定稿——WAL 为唯一串行化提交点，追加互斥；bbolt=滞后投影，其失败不回滚 WAL，恢复从 WAL reconcile/bbolt 可重建——R-1614 会议 #249：旧句「Event Commit ∩ StateFS Commit（两者落盘才对外可见）」物理删除，crash 语义唯一现行=本定义）**；Action Commit=Logical+Physical+Audit 三合一。恢复顺序唯一：先 Event 恢复→statefs reconcile；Audit=append-only 证据链不在 reconcile 范围。权威：05 §3.19.2'
    has_schema: 0
    defined_in: '05软件架构文档.md'
  - name: '状态代数矩阵（R-1095）'
    description: 'Goal 状态机=四维代数 **GoalState×ActionState×PipelineState×ApprovalState**（每维独立终态集合+合法迁移表，交叉合法性穷尽枚举，非法迁移=契约测试拒绝）。Stop/Cancel/Fail 语义分离：**Stopped(user_stopped)**=用户主动停止终态（不伪装 Failed）；Cancelled=治理层撤销；Failed=异常终止。**GoalState=9 态（R-1137，会议 #198）**：Draft/Planned/Running/Paused/NeedsReview/Stopped/Failed/Cancelled/Completed。权威：05 §3.2'
    has_schema: 0
    defined_in: '05软件架构文档.md'
  - name: '唯一 Contract Authority（R-1099）'
    description: '每个契约指定唯一权威文档+权威章节，其余文档引用权威条款而非复述定义——契约权威分散=文档复述漂移（会议 #195 实证：版本头滞后+旧语义残留+备份文件混入）。配套 CI 机检：check-doc-version.sh（版本头=修改记录最新）/check-deprecated.sh（废弃语义残留检测）。权威：00统一术语表 本词条'
