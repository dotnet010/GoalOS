    has_schema: 1
    defined_in: '05软件架构文档.md'
  - name: 'Passthrough Plugin'
    description: 'Capability Plugin 子类型（R-934）。**推迟 v0.5.0 实施（R-925，Jobs+Meyer 双批）**。`execute()` 实现为 `syscall.Exec(target_cmd)`——将自身进程替换为目标 CLI，使目标 CLI 在沙箱约束下直接与用户终端交互（**Unix 语义；Windows 为 CreateProcess+退出码代理，R-904 设计种子**）。PTY 由 Plugin Runner 在子进程启动前分配。stdout/stderr 直接透传，退出码即 Result。`declared_capabilities: ["passthrough.execute"]`。用于 Run 模式'
    has_schema: 0
    defined_in: '05软件架构文档.md'
