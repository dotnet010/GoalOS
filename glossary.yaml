  - name: 'Sandbox'
    description: '沙箱 | OS 级强制隔离执行环境。由声明式 TOML Profile 定义权限边界（文件系统、网络、子进程创建），通过平台原生机制在内核级强制执行。Linux: bwrap ns 族（模式 A）+landlock+seccomp 模式 B 双引擎——R-1681 固定 / macOS: Seatbelt / Windows: AppContainer+ACE 授予面（WinAC——R-1648；agentbox 受限令牌族已退役 R-1680）。支持两种运行形态——Goal 模式（Plugin 子进程内嵌）和 Run 模式（CLI 包裹，Passthrough Plugin + PTY；**Run 模式形态推迟 v0.5.0——R-921/R-925，标注对齐 R-1119**）。不接受代码约定'
    has_schema: 0
    defined_in: '05软件架构文档.md'
