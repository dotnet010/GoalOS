  - name: '统一 spawn 原语（R-1086）'
    description: '通用 fd 卫生契约（08 §18.4 四防线）：已打开 fd 是"已授权句柄"——子进程继承后无需 open() 即可读写，绕过文件白名单与 seccomp 路径过滤双层。四防线：①创建期 wrapper 强制 O_CLOEXEC（CI AST 查裸 fd 创建）②启动期 close_range(5.9+)优先+/proc/self/fd 遍历兜底（**CPython bpo-47260 教训：任何错误无条件 fallback，禁止假设已关闭**）③spawn 期全模块唯一入口（散落 os/exec 直调=CI FAIL）+fork-exec 间 /proc/self/fd 扫描；Windows=PROC_THREAD_ATTRIBUTE_HANDLE_LIST 显式继承白名单 ④验证期对抗契约（子进程 fd 仅 {0,1,2,FD3}）'
    has_schema: 0
    defined_in: '05软件架构文档.md'
  - name: 'seccomp-only 对抗分级（R-1087）'
    description: '信创降级链重排后的 I2 兜底验证分级：**可验证向量**（路径穿越/符号链接劫持/写白名单滥用——BPF 可断言，契约测试全覆盖）vs **已知弱向量**（TOCTOU 路径重解析竞态——seccomp 无法安全按路径过滤，路径可经 /proc/self/fd 重解析；Landlock 因此设计为 inode 级但 4.19 无）——不可完全验证，诚实标注入 FSR bug bar。信创 I4 主路径=gVisor systrap；seccomp-only 仅 I2 兜底+硬化三件。权威：08 §18.3/§19.8'
    has_schema: 0
