    has_schema: 0
    defined_in: '05软件架构文档.md'
  - name: 'Session'
    description: 'v0.2.0 新增。Goal 的运行时隔离单元。每个 Goal 启动时创建独立 Session，持有独立 LLM 连接、Context 窗口、Token 预算。Session 之间零耦合。Session 随 Goal 生命周期结束而销毁（实例化判定句——用户一次对话=创建一个 Goal，权威=05 §2.1，R-1413）。（**概念边界（R-1427——PM 裁定）**：本 Session 与 session_id 均为 GoalOS 自有运行时概念，非模型 API 会话 id；模型 API 交互=无状态请求每次调用自带完整上下文——见 session_id 词条。）（会议 #207 R-1423 两级扩展）交互 Session=Goal 级唯一活跃；任务级子 Session=子 Agent 生命周期——结束即归档日志，只保留在审计事件流（SubAgentSpawned/SubAgentCompleted）。（会议 #107）新 Session 重做（R-741）——同一 GoalID、全新 PipelineState、保留已完成 Action 产出物、不重新 Align、重新 Plan、独立 SessionID、同样失败→ESCALATE。（**边界（R-1496）**：Session=Goal 级运行时隔离单元；ExecutionSession=执行契约激活的执行会话（05 §X.6）——一个 Goal Session 可含多个 ExecutionSession，生命周期正交，禁止混用）'
    has_schema: 0
    defined_in: '05软件架构文档.md'
