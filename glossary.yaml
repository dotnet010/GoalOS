  - name: '标准最小运行时挂载集（R-1084）'
    description: '08 §18.4：允许进入沙箱 namespace 的工具链只读路径**封闭白名单**（/bin、/usr/bin、/usr/lib、/lib、/etc/ld.so.cache 等），未列路径=namespace 内不存在；条目变更走契约变更流程。同决议 fd CLOEXEC 卫生契约：spawn 前全 fd 关至 0/1/2'
    has_schema: 0
