  - name: '红队常态化（R-1083）'
    description: 'LLM 红队 CI：nightly 生成攻击（PyRIT/Rampart/Foundry）→人工/行为测试确认（**非自证**——IEEE 实证扫描器存在可靠性缺陷）→入对抗契约库→PR/发布闸口运行；OWASP LLM Top 10 2025/Agentic Top 10 2026 为 eval gate 基线；红队三件套与生产数据隔离、滥用即金丝雀触发'
