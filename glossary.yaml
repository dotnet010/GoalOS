  - name: 'rollback 物理语义（R-1030/R-1035/R-1094/R-1366）'
    description: '`goalos rollback <id>` 的显式语义：**回滚对象=状态级（GoalState+执行结果，R-1035/R-1366——workspace 文件级回滚不实现，C-PLAT-09 stub 登记，v0.4 评估）**（状态机恢复至上个 Checkpoint，R-772；恢复=Logical Truth 事件重放+Physical Truth 投影对齐，R-1092）+ **重做前置回滚幂等（R-1094 — 会议 #195）**：新 Session 重做前置=回滚点之后的投影→从回滚点事件重放重建；幂等契约：重复执行回滚=状态不变+审计记录 no-op；**回滚不变量（R-1394 L-13）**：状态级回滚后，该 Action 的 workspace 产物标记为脏：回滚区间产物不得被后续校验采纳，直至重新执行覆盖；workspace 外 API 副作用不可撤销（审计留痕）。权威：05 §3.1 rollback 物理语义+statefs 章节'
