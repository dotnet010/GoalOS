  - name: 'SyncWrite（R-1037/R-1041）'
    description: '所有持久化写入的强制原语（05 附录 C.2）：write → fsync → 可选 read-back 诊断模式。完整性与持久性分离：CRC32（条目内）+ seq 单调性（防丢失）+ **hash chain（防线三 防篡改：prev_hash SHA-256 link，R-1041）**。tail scrub 周期验证。不采纳每次回读（OpenZFS #2526）/BeforeImage 双 hash（Checkpoint 可重建）/二进制 WAL（File over Database）。权威：05 附录 C.2'
    has_schema: 0
    defined_in: '05软件架构文档.md'
  - name: 'statefs 不可变状态树（R-1035/R-1366）'
    description: 'workspace 状态级快照机制（05 §3.1）：物理载体=bbolt 唯一（~/.goalos/state.db，R-1109/R-1175）；原版本树机制（`.states/v1..vn` 版本目录+`workspace` 链接+`.current` 指针文件，tmp+rename 原子更新）已删除（R-1366——05 §3.1 同批删除 9 个具名契约测试，改状态级测试集；workspace 文件级回滚不实现，C-PLAT-09 stub 登记，v0.4 评估）。核心操作保留：FileSnapshot=Snapshot（方法名保留）/Commit（原子切换+提交锁，与 Checkpoint R-772+事件流提交点对齐）/Discard（逻辑删除物理保留）。崩溃恢复=指针+事件流双对账（R-1021 统一）。与沙箱正交互补："写不越界"+"写了可回滚"（状态级）。权威：05 §3.1'
    has_schema: 0
    defined_in: '05软件架构文档.md'
  - name: '人类锚点（R-1031）'
    description: '验证金字塔**终极裁决（behavioral_tests）的来源底线**：至少 1 条行为测试必须来自人类锚点（`HUMAN_INJECTED`=用户 CompletionContract 确认/修正注入——确认即锚点事件入审计；`GOLDEN_SET`=用户预置回归测试集）。AI 生成测试不得作为终极裁决唯一来源（无锚点→`human_anchor:"WAIVED"` 用户显式确认路径）。权威：05 §3.3 behavioral_tests 来源标注'
    has_schema: 0
    defined_in: '05软件架构文档.md'
  - name: '离线模式验证策略（R-1032）'
    description: '"完全离线可用"（01 §7）与"Multi-LLM 必须跨 Provider"（05 §3.3）冲突的显式裁决：R0-R1 离线=仅本地单模型（已有）；R2-R3 离线=单模型+用户显式确认+Confidence LOW+恢复联网后补跨 Provider 复核；R4-R5 离线=阻断（fail-closed）。离线执行记录 `offline_verified: true`+单模型 ID 入审计。权威：06 §9.2'
    has_schema: 0
    defined_in: '05软件架构文档.md'
  - name: '错误码知识库（R-1022）'
    description: '09错误码知识库规范.md 定义的错误码工程资产：四段式编码 `[域]-[子域]-[严重级]-[序号]`（域=SBX/IPC/CTR/SKL/CFG/GOV/RTM——R-1334/R-1491，R-1512⑤ 补齐）；严重级 F/R/W/I 对齐四态）；错误码即常量（pkg/errors/codes.go）；`goalos error explain <CODE>` 查询；UI 文案单一入口（禁止写死）。用户可见错误=最根本致死原因（错误冒泡优先级 R-1020：安全越权>资源耗尽>逻辑错误）'
    has_schema: 0
    defined_in: '05软件架构文档.md'
  - name: '审批生命周期（R-1019）'
    description: 'pending 审批合法出口=4 种：Approved / Denied(approval_denied) / approval_timeout / system_restart。超时可配置（PolicyConfig.approval_timeout，默认 300s）；daemon 重启反序列化时一切 approval_pending 强制转 ActionRejected(system_restart)——不自动重新呈现审批交互（fail-closed，杜绝幽灵状态）'
    has_schema: 0
    defined_in: '05软件架构文档.md'
  - name: '内核能力模拟开关枚举（R-960）'
    description: '`GOALOS_SANDBOX_SIMULATE_KERNEL=4.19`（整包模拟）+ per-feature：`GOALOS_SANDBOX_DISABLE_LANDLOCK` / `_SECCOMP_NOTIFY` / `_NAMESPACE` / `_ALL`。仅 CI/诊断用途——生产环境检测到开关置位→daemon 拒绝启动（R-954 防篡改）'
    has_schema: 0
    defined_in: '05软件架构文档.md'
  - name: '语义一致（R-960）'
    description: '跨后端验收标准（验收场景 3）：同一 TOML profile+同一 action 在不同后端得到**相同 ALLOW/DENY 安全判定**。机制实现差异（Landlock vs ACL vs Seatbelt）不构成不一致——判定等价即可'
    has_schema: 0
    defined_in: '05软件架构文档.md'
  - name: '逃逸向量清单（R-960）'
    description: '对抗测试覆盖的攻击向量（参考 runc CVE 系列与容器逃逸公开案例）：①路径穿越（`../` 越白名单）②符号链接劫持（白名单内 symlink 指向外部）③/proc 泄露（宿主进程视图/敏感文件）④namespace 逃逸（子进程 unshare 重建视图）⑤Token/句柄提权（Windows 受限 SID 绕过）⑥写白名单滥用（rw 目录内植入可执行文件再执行）⑦DLL 搜索路径劫持 ⑧reparse point 替换（handle-relative+身份校验 fail-closed）⑨NULL DACL 资源/FAT 卷 ⑩seccomp-notify TOCTOU（指针参数策略判定=竞态面，PIN_ARGS 未落地内核前禁用 CONTINUE 指针判定）⑪默认白名单 syscall 参数级逃逸（SCTPhantom 教训：按参数过滤，非仅 syscall 号）——**R-1072 修订（会议 #192）**：⑦~⑪ 为 Chromium 分层对照与容器逃逸 CVE 时序教训（Leaky Vessels/containerd checkpoint 系列）后扩充；对抗时序=R-1064（随后端落地即对抗）'
    has_schema: 0
    defined_in: '05软件架构文档.md'
  - name: '五支柱模型安全体系（R-1077）'
    description: '会议 #193 威胁模型升级：LLM 使攻击带宽从"人年"降为"秒"，模型本身会系统性尝试突破边界——**白名单/规则判定降级为基础层**，其上叠加五支柱行为级防御：P1 物理隔离升级（gVisor/Windows Sandbox/一次性执行环境）P2 数据面+经济学（金丝雀三层）P3 验证分离（Guard LLM 前置审查）P4 可观测性（目标偏离检测）P5 以 AI 对 AI（LLM 红队常态化）+人机终局裁决（已有）。权威：06 §9.7。**R-1120（会议 #196）命名统一**：全文档唯一概念名（01 变体"五支柱安全基建/五支柱安全体系"已回收；"五支柱组件"=体系内构件表述）'
    has_schema: 0
    defined_in: '05软件架构文档.md'
  - name: 'I4-I5 隔离层级（R-1078/R-1114）'
    description: '隔离层级扩展（06 §5/08 §19.8）：**I4**=gVisor 后端（Sentry 用户态内核+Gofer 9P；KVM 探测优先、无 KVM 自动 systrap——信创 4.19 可跑；不兼容 syscall seccomp 兜底 fail-closed）/Windows Sandbox .wsb（Hyper-V 硬件隔离、air-gap、仅 Pro/Enterprise）；**I5**=一次性执行环境；macOS 诚实标注维持 Seatbelt（无等价物）。自动降级链 I5→I4→I3→I2，每级降级=审计事件+诚实标注'
    has_schema: 0
    defined_in: '05软件架构文档.md'
  - name: '一次性执行环境（R-1079）'
    description: 'I5 隔离层：每次执行全新环境、用完即销毁、无持久状态——对抗"残留探测+跨执行侦察"。生命周期三态机 create→run→destroy；**FileSnapshot（statefs 快照）/复用优化一律不做（简单>性能）**。与 Firecracker/Lambda MicroVM 8h 一次性会话实证对齐（Anthropic Claude 工具调用同模式）'
    has_schema: 0
    defined_in: '05软件架构文档.md'
  - name: '金丝雀（R-1080）'
    description: '数据面经济学防御：三层哨兵（D51 定稿——R-1606/B-3 会议 #248 回改对齐 06 §9.7 与 07 canary_type 枚举）：①假凭据本地解析陷阱（假 API key 指向本地解析地址，解析即触发 ~0.01s——避开静态扫描绕过）②workspace 外哨兵=逃逸检测 ③敏感文件陷阱。触发=审计事件+审批升级+用户通知（只升级不自动阻断）；**零误报硬契约**（正常流程触碰=设计缺陷）；季度轮换+触发即失效重建。权威：06 §9.7'
    has_schema: 0
    defined_in: '05软件架构文档.md'
  - name: 'Guard LLM（R-1081）'
    description: '前置审查第二层（05 §3.17）：第二模型、跨 Provider 部署（OpenAI↔Ollama 交叉）；不可信输入以数据非指令呈现+显式分隔符（Hermes 架构模式）；结构化 verdict=ALLOW/DENY/ESCALATE。DENY=fail-closed；ALLOW 仍需行为测试复核（不自证）；guard 不可用→最高审批级。三层验证链：静态确定性层→Guard LLM→人类终审'
    has_schema: 0
    defined_in: '05软件架构文档.md'
  - name: '目标偏离检测（R-1082）'
    description: '行为级攻击观测（05 §3.18）：两层——确定性层（工具调用集 vs 目标声明集偏离+循环检测+预算异常+金丝雀信号）**零误报硬契约**；语义层 ESN+CUSUM 统计遥测（~200μs/步，无需第二 LLM）。信号→暂停+审批升级+通知+人类裁决（**不自动阻断**）；闭环=drift 确认→statefs rollback→重跑'
