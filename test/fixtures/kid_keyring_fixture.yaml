# kid 密钥环夹具（R-1359/R-1389——会议 #202/#203，LP-16 夹具落点）
#
# 用途（06 §6 Token 轮换）：
#   - TestTokenRotation_KidSelection 转绿判据输入：按 kid 选择密钥、unknown-kid fail-closed、
#     无 kid 遗留 token 按序试验（当前→旧）、验签失败不回退（kid 有约束力）。
# 密钥环语义（R-1389）：载体=secrets.key 同文件节（keyring: [{kid, key, created_at}]）；
#   旧密钥保留=policy.token_ttl 时长；ttl 窗口内二次轮换=保留窗口内全部代际。
# 测试夹具中的 key 为确定性假密钥（非生产密钥；生产=secrets.key 随机 32B）。
version: 1
keyring:
  current:
    kid: "a1b2c3d4e5f60718"          # = SHA-256(key) 前 8 字节 hex（R-1359 派生规则示例）
    key: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    created_at: "2026-08-13T00:00:00Z"
  previous:
    kid: "f0e1d2c3b4a59687"
    key: "fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210"
    created_at: "2026-08-12T00:00:00Z"
test_vectors:
  - id: kid-vec-001
    token_kid: "a1b2c3d4e5f60718"
    description: "带当前 kid 的 token——按 kid 选当前密钥，验签成功"
    expected: verify_ok
  - id: kid-vec-002
    token_kid: "f0e1d2c3b4a59687"
    description: "带旧 kid 的 token——过渡窗口内按 kid 选旧密钥，验签成功"
    expected: verify_ok
  - id: kid-vec-003
    token_kid: "deadbeefdeadbeef"
    description: "未知 kid——fail-closed 拒绝，映射 UNAUTHORIZED→401（R-1389）"
    expected: reject_unknown_kid
  - id: kid-vec-004
    token_kid: null
    description: "无 kid 遗留 token——按序试验（当前→旧）兜底（R-1389/K-09）"
    expected: verify_fallback_order
  - id: kid-vec-005
    token_kid: "a1b2c3d4e5f60718"
    signature: "forged"
    description: "kid 命中但验签失败——拒绝，不回退按序试验（kid 有约束力，防密钥混淆）"
    expected: reject_signature_mismatch
