<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zombie Shooter 2.5D</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="gameContainer"></div>
<div id="hud">
  <div id="topBar">
    <div id="scoreDisplay">Score: <span id="scoreValue">0</span></div>
    <div id="waveDisplay">Wave: <span id="waveValue">0</span></div>
    <div id="zombiesDisplay">Zombies: <span id="zombiesValue">0</span></div>
  </div>
  <div id="controlsHint">WASD: Move | Mouse: Aim | Click: Shoot | 1/2/3: Weapons | Q: Grenade | E: Time Slow | R: Reload</div>
  <div id="bottomLeft">
    <div id="healthBarContainer">
      <div id="healthBar"></div>
      <span id="healthText">100</span>
    </div>
  </div>
  <div id="bottomRight">
    <div id="weaponDisplay">
      <div class="weaponSlot" id="weapon1">1. Pistol</div>
      <div class="weaponSlot" id="weapon2">2. Shotgun</div>
      <div class="weaponSlot" id="weapon3">3. Rifle</div>
    </div>
    <div id="ammoDisplay">Ammo: <span id="ammoValue">&infin;</span></div>
  </div>
  <div id="skillBar">
    <div class="skillSlot" id="skillGrenade">Q: Grenade</div>
    <div class="skillSlot" id="skillTimeSlow">E: Time Slow</div>
  </div>
  <div id="crosshair">+</div>
  <div id="waveAnnouncement"></div>
  <div id="gameOverScreen" style="display:none">
    <h1>GAME OVER</h1>
    <p>Final Score: <span id="finalScore">0</span></p>
    <p>Wave Reached: <span id="finalWave">1</span></p>
    <button onclick="location.reload()">Restart</button>
  </div>
</div>
<script src="js/Game.js"></script>
<script src="js/Particle.js"></script>
<script src="js/Projectile.js"></script>
<script src="js/Player.js"></script>
<script src="js/Zombie.js"></script>
<script src="js/Weapon.js"></script>
<script src="js/Skill.js"></script>
<script src="js/WaveSystem.js"></script>
<script src="js/UI.js"></script>
<script src="js/main.js"></script>
</body>
</html>
